<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-md md:p-xxl antialiased relative overflow-hidden">
<!-- Decorative Background Elements -->

<div class="absolute bottom-1/4 -right-1/4 w-1/2 h-1/2 bg-secondary-container/20 rounded-full blur-[120px]"></div>

<!-- Registration Card Container -->
<main class="w-full max-w-[480px] z-10 relative">
<div class="bg-surface-container/60 backdrop-blur-xl border border-outline-variant rounded-xl shadow-2xl overflow-hidden">
<!-- Top Gradient Accent -->
<div class="h-1 w-full brand-gradient"></div>
<div class="p-lg md:p-xl flex flex-col gap-lg">
<!-- Header -->
<div class="text-center flex flex-col items-center gap-sm">
<div class="w-12 h-12 bg-surface-variant border border-outline-variant rounded-lg flex items-center justify-center mb-sm">
<span class="material-symbols-outlined text-primary" style="font-size: 28px;">fastfood</span>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface">Create an Account</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Join MysteryBox Fresh Food to start fighting food waste.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-md" onsubmit="event.preventDefault();">
<!-- Role Selector -->
<div class="flex gap-sm p-sm bg-surface-container-low border border-outline-variant rounded-lg">
<button class="flex-1 py-xs px-sm rounded font-body-sm text-body-sm bg-surface-variant text-on-surface border border-outline transition-colors" id="role-customer" onclick="setRole('customer')" type="button">
                            Customer
                        </button>
<button class="flex-1 py-xs px-sm rounded font-body-sm text-body-sm text-on-surface-variant hover:text-on-surface hover:bg-surface-variant transition-colors" id="role-vendor" onclick="setRole('vendor')" type="button">
                            Vendor
                        </button>
</div>
<!-- Display Name -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="displayName">Display Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant">person</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg pl-xl pr-sm py-sm font-body-lg text-body-lg text-on-surface placeholder-on-surface-variant/50 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors" id="displayName" placeholder="e.g. Alex Doe" type="text">
</div>
</div>
<!-- Store Name (Conditional) -->
<div class="flex-col gap-xs hidden" id="store-name-container">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="storeName">Store Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant">storefront</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg pl-xl pr-sm py-sm font-body-lg text-body-lg text-on-surface placeholder-on-surface-variant/50 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors" id="storeName" placeholder="e.g. The Daily Bread" type="text">
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant">mail</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg pl-xl pr-sm py-sm font-body-lg text-body-lg text-on-surface placeholder-on-surface-variant/50 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors" id="email" placeholder="alex@example.com" type="email">
</div>
</div>
<!-- Password -->

<label class="font-label-caps text-label-caps text-on-surface-variant" for="password">Password</label>

</button>

<script>
        function setRole(role) {
            const customerBtn = document.getElementById('role-customer');
            const vendorBtn = document.getElementById('role-vendor');
            const storeNameContainer = document.getElementById('store-name-container');

            if (role === 'customer') {
                customerBtn.classList.add('bg-surface-variant', 'text-on-surface', 'border-outline');
                customerBtn.classList.remove('text-on-surface-variant');
                
                vendorBtn.classList.remove('bg-surface-variant', 'text-on-surface', 'border-outline');
                vendorBtn.classList.add('text-on-surface-variant', 'border-transparent');

                storeNameContainer.classList.add('hidden');
                storeNameContainer.classList.remove('flex');
            } else {
                vendorBtn.classList.add('bg-surface-variant', 'text-on-surface', 'border-outline');
                vendorBtn.classList.remove('text-on-surface-variant', 'border-transparent');
                
                customerBtn.classList.remove('bg-surface-variant', 'text-on-surface', 'border-outline');
                customerBtn.classList.add('text-on-surface-variant', 'border-transparent');

                storeNameContainer.classList.remove('hidden');
                storeNameContainer.classList.add('flex');
            }
        }
    </script>
