<style>
        /* Custom Animations */
        @keyframes scan-vertical {
            0% { transform: translateY(0%); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(100%); opacity: 0; }
        }
        
        .scan-line-container {
            animation: scan-vertical 2.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        .neon-border-glow-primary {
            box-shadow: 0 0 8px theme('colors.primary'), inset 0 0 8px theme('colors.primary');
        }
        
        .neon-border-glow-secondary {
            box-shadow: 0 0 8px theme('colors.secondary'), inset 0 0 8px theme('colors.secondary');
        }

        /* Subtle grid background for the viewfinder */
        .bg-grid-pattern {
            background-size: 20px 20px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

<div class="absolute inset-0 bg-background/85"></div>

<button class="text-primary hover:bg-surface-variant/20 active:scale-95 p-2 rounded-full flex items-center justify-center transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">qr_code_scanner</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary tracking-tight">Verify Pickup</h1>
<button class="text-on-surface-variant hover:bg-surface-variant/20 active:scale-95 p-2 rounded-full flex items-center justify-center transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">history</span>
</button>
</header>
<!-- Main Scanner Canvas -->
<main class="flex-1 flex flex-col items-center justify-center relative z-10 w-full px-lg">
<!-- Viewfinder Container -->
<div class="relative w-64 h-64 sm:w-80 sm:h-80 mb-xl flex-shrink-0">
<!-- Glassmorphism Backdrop -->
<div class="absolute inset-0 bg-surface-container/40 backdrop-blur-md rounded-2xl border border-outline-variant bg-grid-pattern overflow-hidden shadow-2xl">
<!-- Scanning Line Animation -->
<div class="scan-line-container absolute top-0 left-0 w-full h-full flex flex-col pointer-events-none z-20">
<div class="h-[2px] w-full bg-gradient-to-r from-transparent via-primary-fixed to-transparent opacity-90 blur-[0.5px]"></div>
<div class="h-24 w-full bg-gradient-to-b from-primary/20 to-transparent"></div>
</div>
</div>

<div class="absolute -top-1 -left-1 w-10 h-10 border-t-[3px] border-l-[3px] border-primary rounded-tl-2xl neon-border-glow-primary z-30"></div>

<div class="absolute -bottom-1 -left-1 w-10 h-10 border-b-[3px] border-l-[3px] border-secondary rounded-bl-2xl neon-border-glow-secondary z-30"></div>
<div class="absolute -bottom-1 -right-1 w-10 h-10 border-b-[3px] border-r-[3px] border-primary rounded-br-2xl neon-border-glow-primary z-30"></div>

<span class="font-label-caps text-label-caps text-primary tracking-widest uppercase">Scanning...</span>
</div>

<p class="font-body-sm text-body-sm text-on-surface-variant text-center max-w-[260px] z-20">
            Align QR code within the frame to verify customer pickup
        </p>
