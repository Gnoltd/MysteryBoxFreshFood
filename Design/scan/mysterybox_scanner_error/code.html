<style>
        .error-glow {
            background: radial-gradient(circle at center, rgba(147, 0, 10, 0.4) 0%, rgba(12, 19, 36, 1) 70%);
            animation: pulse-red 2s infinite alternate;
        }
        @keyframes pulse-red {
            0% { opacity: 0.8; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1.05); }
        }
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        .btn-gradient {
            background: linear-gradient(135deg, #494bd6 0%, #6f00be 100%);
        }
        .glass-card {
            background: rgba(147, 0, 10, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 180, 171, 0.2);
        }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-lg overflow-hidden relative">
<!-- Atmospheric Background -->
<div class="absolute inset-0 error-glow z-0 pointer-events-none"></div>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center p-gutter z-10 w-full max-w-md mx-auto h-[calc(100vh-80px)]">
<div class="glass-card w-full rounded-2xl p-xl flex flex-col items-center text-center shake shadow-2xl relative overflow-hidden">
<!-- Top Error Highlight -->
<div class="absolute top-0 left-0 w-full h-1 bg-error"></div>
<!-- Error Icon Circle -->
<div class="w-32 h-32 rounded-full bg-error-container/30 border border-error/50 flex items-center justify-center mb-lg relative">
<div class="absolute inset-0 rounded-full border-2 border-error/20 animate-ping opacity-75"></div>
<span class="material-symbols-outlined text-[64px] text-error" style="font-variation-settings: 'FILL' 1;">
                    cancel
                </span>
</div>
<!-- Typography -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-error mb-sm">
                Invalid QR Code
            </h1>
<p class="font-body-lg text-body-lg text-on-error-container/80 mb-xl max-w-[240px]">
                This code has already been scanned or is unrecognized by the system.
            </p>
<!-- Actions -->
<button class="w-full btn-gradient text-white font-label-caps text-label-caps py-md rounded-lg flex items-center justify-center gap-xs active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[18px]">refresh</span>
                Try Again
            </button>
<button class="w-full mt-sm border border-outline-variant text-on-surface font-label-caps text-label-caps py-md rounded-lg flex items-center justify-center gap-xs hover:bg-surface-variant/20 active:scale-95 transition-all">
                Manual Entry
            </button>
</div>
</main>
<!-- BottomNavBar (Shared Component) -->
<nav class="bg-surface-container/80 dark:bg-surface-container/80 backdrop-blur-xl border-t border-outline-variant shadow-lg fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 pb-safe px-4 md:hidden rounded-t-xl">
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">filter_center_focus</span>
<span class="font-label-caps text-label-caps mt-1">Scanner</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-90" href="#">

<span class="font-label-caps text-label-caps mt-1">Orders</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-90" href="#">

</a>

<script>
        // Micro-interaction: Trigger shake on load
        document.addEventListener('DOMContentLoaded', () => {
            const card = document.querySelector('.glass-card');
            // Remove shake class after animation completes so it can be re-triggered if needed
            setTimeout(() => {
                card.classList.remove('shake');
            }, 600);
        });
    </script>
